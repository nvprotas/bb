name: Android SSH APK

on:
  push:
    branches:
      - android-ssh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ssh-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build dev APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: 22.x
          pnpm-version: 9.15.0
          cache-prefix: android-ssh-apk

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Typecheck, test and lint mobile
        run: pnpm exec turbo run typecheck test lint --filter=@bb/mobile

      - name: Build dev APK
        env:
          CI: "1"
        run: bash apps/mobile/scripts/build-android-dev.sh arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bb-dev-android-ssh
          path: apps/mobile/build-output/bb-dev.apk
          if-no-files-found: error
          retention-days: 14
